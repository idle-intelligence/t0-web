<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>t0 head-to-head: our t0-wasm bench</title>
</head>
<body>
<pre id="log"></pre>
<script type="module">
const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log(s); };
window.__log = log;

const CONTEXT = 512;
const HORIZON = 32;
const N_BATCH = 24;
const CHUNK = 16; // t0_core::DEFAULT_BATCH_CHUNK -- Metal shared-memory cap, see model.rs

function median(a) {
  const s = [...a].sort((x, y) => x - y);
  const n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}

async function loadSeries() {
  const buf = await fetch('./series.f32').then((r) => r.arrayBuffer());
  return new Float32Array(buf);
}

async function benchOne(pkgDir, ggufUrl, backendLabel) {
  const t0wasm = await import(`${pkgDir}/t0_wasm.js`);
  await t0wasm.default();
  await t0wasm.initBackend();

  const modelResp = await fetch(ggufUrl);
  const sizeBytes = parseInt(modelResp.headers.get('content-length') || '0', 10);
  const modelBuf = await modelResp.arrayBuffer();

  const series = await loadSeries();
  const origin = 3600;
  const context = series.slice(origin - CONTEXT, origin);

  const model = t0wasm.T0Wasm.load(new Uint8Array(modelBuf));

  // cold: first forecast call (first-use shader compile/autotune on wgpu)
  const c0 = performance.now();
  const firstOut = await model.forecast(context, HORIZON);
  const cold = performance.now() - c0;

  // warm: median of 10
  const times = [];
  let lastOut = firstOut;
  for (let i = 0; i < 10; i++) {
    const t0 = performance.now();
    lastOut = await model.forecast(context, HORIZON);
    times.push(performance.now() - t0);
  }
  const warmMedian = median(times);

  // 24-signal batch, chunked by 16
  let batch;
  try {
    const t0 = performance.now();
    await model.forecastBatch(context, N_BATCH, HORIZON, CHUNK);
    const ms = performance.now() - t0;
    batch = { n: N_BATCH, chunk: CHUNK, ms, msPerSignal: ms / N_BATCH };
  } catch (e) {
    batch = { error: e.message || String(e) };
  }

  // t0-fast only (see crates/t0-wasm/src/fast.rs) -- absent on the Burn
  // builds, so this is undefined there rather than an error.
  const gpuBytes = typeof model.gpuBytes === 'function' ? model.gpuBytes() : undefined;

  return {
    backend: backendLabel,
    sizeBytes,
    gpuBytes,
    cold,
    warmMedian,
    warmAll: times,
    batch,
    firstOutput: Array.from(lastOut.slice(0, HORIZON * model.nQuantiles())),
  };
}

let __traceState = null;

async function warmup(pkgDir, ggufUrl) {
  const t0wasm = await import(`${pkgDir}/t0_wasm.js`);
  await t0wasm.default();
  await t0wasm.initBackend();
  const modelBuf = await fetch(ggufUrl).then((r) => r.arrayBuffer());
  const series = await loadSeries();
  const origin = 3600;
  const context = series.slice(origin - CONTEXT, origin);
  const model = t0wasm.T0Wasm.load(new Uint8Array(modelBuf));
  // a few warm calls before tracing so cold-start shader compile/autotune
  // isn't in the traced window
  for (let i = 0; i < 3; i++) await model.forecast(context, HORIZON);
  __traceState = { model, context };
}

async function oneForecast() {
  performance.mark('t0-forecast-start');
  await __traceState.model.forecast(__traceState.context, HORIZON);
  performance.mark('t0-forecast-end');
  performance.measure('t0-forecast', 't0-forecast-start', 't0-forecast-end');
}

async function oneBatch() {
  performance.mark('t0-batch-start');
  await __traceState.model.forecastBatch(__traceState.context, N_BATCH, HORIZON, CHUNK);
  performance.mark('t0-batch-end');
  performance.measure('t0-batch', 't0-batch-start', 't0-batch-end');
}

window.__bench = {
  benchOne,
  warmup,
  oneForecast,
  oneBatch,
};

log('ready');
</script>
</body>
</html>
