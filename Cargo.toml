[workspace]
members = ["crates/t0-core", "crates/cli", "crates/t0-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
burn = { version = "0.20", default-features = false, features = ["std"] }
burn-ndarray = { version = "0.20", default-features = false }
burn-wgpu = { version = "0.20", default-features = false }
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
anyhow = "1.0"
