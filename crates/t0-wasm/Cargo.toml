[package]
name = "t0-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ndarray"]
ndarray = ["burn-ndarray"]
wgpu = ["burn-wgpu"]
# t0-fast path: no Burn at inference (see crates/t0-fast). Build with
# `--no-default-features --features fast` -- mutually exclusive with
# ndarray/wgpu in practice (both `T0Wasm` impls are cfg'd out when the
# other is selected), same one-feature-per-wasm-pack-build convention as
# ndarray/wgpu.
fast = ["dep:t0-fast"]
# Multithreaded ndarray backend (rayon over web workers via
# wasm-bindgen-rayon). Feasibility spike only -- see docs/runs -- not yet
# wired into web/.
threads = ["ndarray", "burn-ndarray/multi-threads", "dep:wasm-bindgen-rayon"]

[dependencies]
t0-core = { path = "../t0-core" }
t0-fast = { path = "../t0-fast", optional = true, features = ["wasm"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
burn = { workspace = true }
burn-ndarray = { workspace = true, optional = true }
burn-wgpu = { workspace = true, optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
